name: Capital One daily available events
on:
  schedule:
    - cron: '30 7 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      dispatch_mode:
        description: 'Daily delivery or separate test'
        type: choice
        options: [test, daily]
        default: test
permissions:
  contents: read
  issues: write
concurrency:
  group: capital-one-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      # Ubuntu 24.04 already has Chromium's runtime libraries. Avoid an apt
      # update on every check; a mirror outage must not prevent a scan.
      - run: npx playwright install --only-shell chromium
      - run: node digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_OWNER: ${{ github.repository_owner }}
          DIGEST_DISPATCH_MODE: ${{ inputs.dispatch_mode || 'test' }}
