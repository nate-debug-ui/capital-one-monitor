name: Capital One daily available events
on:
  schedule:
    - cron: '30 7 * * *'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: capital-one-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_OWNER: ${{ github.repository_owner }}
