name: Capital One new events
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: capital-one-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      # Ubuntu 24.04 already has Chromium's runtime libraries. Avoid an apt
      # update on every check; a mirror outage must not prevent a scan.
      - run: npx playwright install --only-shell chromium
      - run: npm start
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_OWNER: ${{ github.repository_owner }}
